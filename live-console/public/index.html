<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>360° Advisor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;450;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* Restrained institutional: a serious face for headings, a clear one for
     reading, monospace wherever digits must line up. Colour carries meaning —
     red is risk, green is gain — and is used nowhere decorative. */
  :root {
    --bg:#F7F7F4; --surface:#FFFFFF; --sunk:#EFEFEA; --line:#DEDDD6;
    --line-strong:#C8C7BE;
    --ink:#1A1A17; --ink-2:#43433D; --muted:#6E6E65;
    --accent:#8A6A1F; --accent-soft:#F2EAD7;
    --up:#1D6B48; --up-soft:#E0EDE6; --down:#A32E22; --down-soft:#F5E2DF;
    --warn:#8A6A12; --warn-soft:#F5EDD9; --info:#2C5C74; --info-soft:#E2ECF1;
    --shadow:0 1px 2px rgba(26,26,23,.05), 0 4px 14px rgba(26,26,23,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#14140F; --surface:#1C1C17; --sunk:#232320; --line:#32322C;
      --line-strong:#45453D;
      --ink:#EDEDE6; --ink-2:#C7C7BE; --muted:#94948B;
      --accent:#D6AC55; --accent-soft:#2E2614;
      --up:#5FB98A; --up-soft:#16291F; --down:#DE7A6C; --down-soft:#301B18;
      --warn:#D3AE55; --warn-soft:#2B2413; --info:#7FB0C8; --info-soft:#16242B;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    --bg:#14140F; --surface:#1C1C17; --sunk:#232320; --line:#32322C;
    --line-strong:#45453D;
    --ink:#EDEDE6; --ink-2:#C7C7BE; --muted:#94948B;
    --accent:#D6AC55; --accent-soft:#2E2614;
    --up:#5FB98A; --up-soft:#16291F; --down:#DE7A6C; --down-soft:#301B18;
    --warn:#D3AE55; --warn-soft:#2B2413; --info:#7FB0C8; --info-soft:#16242B;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  }

  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:15px;
         line-height:1.55; font-feature-settings:"kern"; }
  .mono { font-family:"IBM Plex Mono",ui-monospace,monospace;
          font-variant-numeric:tabular-nums; }
  h1,h2,h3 { font-family:Fraunces,Georgia,serif; font-weight:600;
             letter-spacing:-0.01em; margin:0; text-wrap:balance; }
  h1 { font-size:30px; line-height:1.2; }
  h2 { font-size:19px; margin:0 0 12px; }
  h3 { font-size:15px; }
  p { margin:0 0 12px; }
  a { color:var(--accent); text-underline-offset:2px; }
  a:hover { color:var(--ink); }

  /* ---- chrome ---- */
  header { background:var(--surface); border-bottom:1px solid var(--line);
           position:sticky; top:0; z-index:40; }
  .hwrap { max-width:1180px; margin:0 auto; padding:14px 26px;
           display:flex; align-items:center; gap:22px; }
  .brand { font-family:Fraunces,Georgia,serif; font-weight:700; font-size:17px;
           letter-spacing:-0.01em; cursor:pointer; white-space:nowrap; }
  .brand em { font-style:normal; color:var(--accent); }
  nav { display:flex; gap:3px; }
  nav button { font-family:inherit; font-weight:500; font-size:14px;
    background:none; border:none; color:var(--muted); padding:7px 13px;
    border-radius:6px; cursor:pointer; }
  nav button:hover { color:var(--ink); background:var(--sunk); }
  nav button[aria-current="page"] { color:var(--ink); background:var(--sunk);
    font-weight:600; }
  .search { margin-left:auto; display:flex; align-items:center; gap:9px; }
  .search input { font-family:"IBM Plex Mono",monospace; font-size:13.5px;
    padding:8px 12px; border:1px solid var(--line); border-radius:7px;
    background:var(--bg); color:var(--ink); width:190px; }
  .search input:focus { outline:2px solid var(--accent); outline-offset:1px;
    border-color:transparent; }
  #regime { font-size:12.5px; color:var(--muted); white-space:nowrap; }
  #regime b { color:var(--ink); font-weight:600; }

  main { max-width:1180px; margin:0 auto; padding:30px 26px 90px; }
  .screen { display:none; }
  .screen.on { display:block; }
  .lede { color:var(--muted); max-width:64ch; margin:6px 0 26px; font-size:15.5px; }

  /* ---- surfaces ---- */
  .card { background:var(--surface); border:1px solid var(--line);
          border-radius:10px; padding:22px; box-shadow:var(--shadow); }
  .card + .card { margin-top:16px; }
  .card.flush { padding:8px 22px 16px; }
  .grid { display:grid; gap:16px; }
  .g2 { grid-template-columns:1fr 1fr; }
  .g3 { grid-template-columns:repeat(3,1fr); }
  .g4 { grid-template-columns:repeat(4,1fr); }
  @media (max-width:900px){ .g2,.g3,.g4 { grid-template-columns:1fr; } }
  .sectionhead { display:flex; align-items:baseline; gap:12px; margin:34px 0 12px; }
  .sectionhead h2 { margin:0; }
  .sectionhead .note { color:var(--muted); font-size:13px; }

  /* ---- the loud alert: reserved for a breached exit price ---- */
  .alarm { border:2px solid var(--down); background:var(--down-soft);
    border-radius:10px; padding:22px 24px; margin-bottom:16px;
    display:flex; gap:18px; align-items:flex-start; }
  .alarm .mark { width:40px; height:40px; border-radius:50%; background:var(--down);
    color:#fff; display:flex; align-items:center; justify-content:center;
    flex-shrink:0; font-family:Fraunces,serif; font-size:22px; font-weight:700; }
  .alarm h2 { color:var(--down); font-size:21px; margin:0 0 4px; }
  .alarm .body { flex:1; }
  .alarm .act { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }

  .notice { border-radius:9px; padding:15px 18px; font-size:14.5px; line-height:1.55;
            margin:14px 0; border:1px solid transparent; }
  .notice.warn { background:var(--warn-soft); border-color:var(--warn); color:var(--ink); }
  .notice.info { background:var(--info-soft); border-color:var(--line); color:var(--ink-2); }
  .notice.calm { background:var(--sunk); color:var(--muted); }
  .notice .k { display:block; font-size:11.5px; font-weight:600; letter-spacing:.08em;
    text-transform:uppercase; color:var(--muted); margin-bottom:5px; }

  /* ---- numbers ---- */
  .stat { display:flex; flex-direction:column; gap:3px; }
  .stat .k { font-size:11.5px; font-weight:600; letter-spacing:.07em;
    text-transform:uppercase; color:var(--muted); }
  .stat .v { font-family:"IBM Plex Mono",monospace; font-size:25px; font-weight:500;
    font-variant-numeric:tabular-nums; letter-spacing:-0.01em; }
  .stat .s { font-size:13px; color:var(--muted); }
  .stat.good .v { color:var(--up); } .stat.bad .v { color:var(--down); }
  .pos { color:var(--up); } .neg { color:var(--down); }

  table { border-collapse:collapse; width:100%; font-size:14px; }
  th { text-align:left; font-size:11.5px; font-weight:600; letter-spacing:.07em;
    text-transform:uppercase; color:var(--muted); padding:11px 10px;
    border-bottom:1px solid var(--line-strong); white-space:nowrap; }
  td { padding:12px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tbody tr:last-child td { border-bottom:none; }
  .num { text-align:right; font-family:"IBM Plex Mono",monospace;
         font-variant-numeric:tabular-nums; white-space:nowrap; }
  tr.go { cursor:pointer; }
  tr.go:hover td { background:var(--sunk); }
  .sym { font-weight:600; }
  .sub { color:var(--muted); font-size:12.5px; }

  .pill { display:inline-block; font-size:11px; font-weight:600; letter-spacing:.05em;
    text-transform:uppercase; border-radius:999px; padding:4px 10px; }
  .pill.up{background:var(--up-soft);color:var(--up)}
  .pill.down{background:var(--down-soft);color:var(--down)}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}
  .pill.info{background:var(--info-soft);color:var(--info)}
  .pill.mut{background:var(--sunk);color:var(--muted)}
  .pill.acc{background:var(--accent-soft);color:var(--accent)}

  button.primary { font-family:inherit; font-weight:600; font-size:15px;
    background:var(--ink); color:var(--bg); border:none; border-radius:7px;
    padding:13px 22px; cursor:pointer; min-height:46px; }
  button.primary:hover { opacity:.9; }
  button.danger { background:var(--down); color:#fff; }
  button.ghost { font-family:inherit; font-weight:500; font-size:14px;
    background:var(--surface); color:var(--ink); border:1px solid var(--line-strong);
    border-radius:7px; padding:11px 17px; cursor:pointer; min-height:42px; }
  button.ghost:hover { border-color:var(--ink); }
  button:focus-visible, input:focus-visible, select:focus-visible,
  summary:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

  /* ---- the reasoning: the thing this app is built around ---- */
  details.why { border-top:1px solid var(--line); margin-top:14px; padding-top:12px; }
  details.why > summary { cursor:pointer; font-size:13px; font-weight:600;
    color:var(--muted); list-style:none; display:flex; align-items:center; gap:7px; }
  details.why > summary::-webkit-details-marker { display:none; }
  details.why > summary::before { content:"▸"; font-size:11px; transition:transform .15s; }
  details.why[open] > summary::before { transform:rotate(90deg); }
  details.why > summary:hover { color:var(--ink); }
  ol.chain { margin:14px 0 0; padding:0; list-style:none;
             border-left:2px solid var(--line-strong); }
  ol.chain li { position:relative; padding:0 0 16px 20px; font-size:14px; }
  ol.chain li:last-child { padding-bottom:2px; }
  ol.chain li::before { content:""; position:absolute; left:-5px; top:7px;
    width:8px; height:8px; border-radius:50%; background:var(--line-strong);
    border:2px solid var(--surface); }
  ol.chain li.key::before { background:var(--accent); }
  ol.chain .stage { font-size:11.5px; font-weight:600; letter-spacing:.07em;
    text-transform:uppercase; color:var(--muted); display:block; margin-bottom:2px; }
  ol.chain .finding { color:var(--ink-2); }
  @media (prefers-reduced-motion:reduce){ details.why > summary::before{transition:none} }

  /* ---- charts ---- */
  .chartwrap { width:100%; }
  .chart-empty { display:flex; align-items:center; justify-content:center;
    background:var(--sunk); border-radius:8px; color:var(--muted); font-size:13.5px;
    text-align:center; padding:0 20px; }
  .gridline { stroke:var(--line); stroke-width:1; }
  .gridline-zero { stroke:var(--line-strong); stroke-width:1; }
  .axis { fill:var(--muted); font-size:11px;
          font-family:"IBM Plex Mono",monospace; }
  .series-price { stroke:var(--ink); stroke-width:1.6; }
  .series-avg { stroke:var(--muted); stroke-width:1.1; stroke-dasharray:4 3; }
  .series-area { fill:var(--accent); opacity:.07; }
  .series-last { fill:var(--ink); stroke:var(--surface); stroke-width:2; }
  .ref-exit { stroke:var(--down); stroke-width:1.2; stroke-dasharray:5 3; }
  .ref-entry { stroke:var(--info); stroke-width:1.2; stroke-dasharray:5 3; }
  .ref-label { font-size:10.5px; font-family:"IBM Plex Mono",monospace; }
  text.ref-exit { fill:var(--down); stroke:none; }
  text.ref-entry { fill:var(--info); stroke:none; }
  .bar { fill:var(--accent); } .bar-2 { fill:var(--up); } .bar-3 { fill:var(--info); }
  .band-a { fill:var(--accent); opacity:.75; }
  .band-b { fill:var(--info); opacity:.7; }
  .band-c { fill:var(--up); opacity:.65; }
  .band-d { fill:var(--muted); opacity:.35; }
  .band-track { fill:var(--sunk); }
  .band-fair { fill:var(--up); opacity:.28; }
  .band-base { stroke:var(--up); stroke-width:2; }
  .band-price { fill:var(--ink); stroke:var(--surface); stroke-width:2.5; }
  .band-label { fill:var(--muted); font-size:11px;
    font-family:"IBM Plex Mono",monospace; }
  text.band-label.price { fill:var(--ink); font-weight:500; }
  .spark-line { stroke:var(--ink-2); stroke-width:1.3; }
  .spark-last { fill:var(--accent); }
  .chart-legend { display:flex; gap:16px; align-items:center; margin-top:9px;
    font-size:12.5px; color:var(--muted); flex-wrap:wrap; }
  .swatch { display:inline-block; width:9px; height:9px; border-radius:2px;
    margin-right:6px; vertical-align:baseline; }
  i.swatch.bar{background:var(--accent)} i.swatch.bar-2{background:var(--up)}
  i.swatch.bar-3{background:var(--info)}
  i.swatch.band-a{background:var(--accent)} i.swatch.band-b{background:var(--info)}
  i.swatch.band-c{background:var(--up)} i.swatch.band-d{background:var(--muted)}
  .chart-foot { display:flex; justify-content:space-between; color:var(--muted);
    font-size:11.5px; font-family:"IBM Plex Mono",monospace; margin-top:5px; }

  /* ---- gaps, shown in place ---- */
  .gap { background:var(--sunk); border:1px dashed var(--line-strong);
    border-radius:8px; padding:15px 18px; color:var(--muted); font-size:13.5px; }
  .gap b { color:var(--ink-2); font-weight:600; }

  .muted { color:var(--muted); font-size:13px; }
  .spin { display:inline-block; width:13px; height:13px;
    border:2px solid var(--line); border-top-color:var(--accent);
    border-radius:50%; animation:sp .8s linear infinite; vertical-align:-2px;
    margin-right:8px; }
  @keyframes sp { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce){ .spin{animation:none} }
  footer { max-width:1180px; margin:0 auto; padding:20px 26px 50px;
    border-top:1px solid var(--line); color:var(--muted); font-size:12.5px; }
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand" id="brand">360° <em>Advisor</em></div>
    <nav>
      <button data-nav="home" aria-current="page">Today</button>
      <button data-nav="invest">Invest</button>
      <button data-nav="portfolio">Portfolio</button>
    </nav>
    <div class="search">
      <span id="regime"></span>
      <input id="lookup" type="text" placeholder="Company symbol" list="symlist"
             autocomplete="off" aria-label="Look up a company">
      <datalist id="symlist"></datalist>
    </div>
  </div>
</header>

<main>
  <section class="screen on" id="s-home"></section>
  <section class="screen" id="s-company"></section>
  <section class="screen" id="s-invest"></section>
  <section class="screen" id="s-portfolio"></section>
</main>

<footer>
  Decision support, not investment advice. Every figure comes from a named source and
  every conclusion opens into the steps that produced it — if the reasoning looks wrong
  to you, it probably is, and that is the point.
</footer>

<script src="./charts.js"></script>
<script src="./info.js"></script>
<script src="./verdict.js"></script>
<script src="./deepdive.js"></script>
<script src="./company.js"></script>
<script src="./app.js"></script>
</body>
</html>
